name: Build Desktop (Win/macOS/Linux)

# 运行名称：打标签推送 → 显示标签名（如 v1.0.24）；
# 推 main → 显示推送提交的第一行；Actions 列表里一眼找到对应版本。
run-name: Build ${{ github.ref_type == 'tag' && github.ref_name || github.event.head_commit.message }}

on:
  # 仅打 v* 标签推送时才构建并发布。发版流程：本地 bump VERSION → git tag vX.Y.Z → git push origin vX.Y.Z。
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            ext: ".exe"
          - os: macos
            runner: macos-latest
            ext: ""
          - os: linux
            runner: ubuntu-latest
            ext: ""
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # v1.0.26：改用 Nuitka 编译（替代 PyInstaller）。Nuitka 把 Python 编译成原生
      # 机器码，产物在 Defender 眼里等同普通 C++ 程序，报毒率极低（实测 2/71），
      # 且源码被编译保护。Python 3.12 由 setup-python 提供，编译器由 runner 自带
      # （Windows: MSVC / macOS: clang / Linux: gcc），无需额外安装。
      - name: Install Nuitka
        run: python -m pip install --upgrade pip nuitka

      # 离线激活验签为**纯标准库 Ed25519**（tfd_app/ed25519_verify.py），无第三方加密
      # 依赖，故无需安装 crypto 包。公钥已嵌入源码，私钥只在卖家本机（绝不进 CI）。

      - name: Install pywin32 (Windows only, in-process Word/WPS .doc conversion)
        if: matrix.os == 'windows'
        run: python -m pip install pywin32

      - name: Install Tk runtime (Linux only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tk tcl zip

      # macOS 需要 .icns 作为 app 图标（PNG→ICNS 用 Pillow）。
      - name: Generate icon.icns (macOS only)
        if: matrix.os == 'macos'
        run: |
          python -m pip install --quiet pillow
          python -c "from PIL import Image; Image.open('tfd_app/assets/icon.png').save('tfd_app/assets/icon.icns', format='ICNS', sizes=[(16,16),(32,32),(64,64),(128,128),(256,256),(512,512),(1024,1024)])"
          ls -la tfd_app/assets/icon.icns

      # Nuitka 编译为 standalone 文件夹（运行时不自解压，规避 dropper 指纹）。
      - name: Build (${{ matrix.os }})
        shell: bash
        run: python build.py

      # Windows zip 主推分发（纯绿色版）：只生成「使用说明.txt」。
      # 桌面快捷方式由软件自身创建（win32com 已内置 exe，客户零依赖、零黑框；
      # 首次启动自动静默创建一次；顶栏“桌面图标”可随时手动补建）。
      # v1.0.32：产物目录/主程序已中文化——dist 目录即 zip 顶层文件夹
      # （论文格式医生·导师版（免安装版）），主程序 1.论文格式医生·导师版.exe。
      # 注意：本脚本输出必须 ASCII-safe——GitHub Windows runner 控制台是 cp1252，
      # 打印中文文件名会 UnicodeEncodeError（v1.0.30 CI 曾因此崩溃）。
      - name: Generate portable install assets (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          python tools/make_portable_assets.py --dist "dist\论文格式医生·导师版（免安装版）" --exe "1.论文格式医生·导师版.exe" --install-sub "ThesisFormatDoctorMentor" --product "论文格式医生·导师版"

      # Windows：用 NSIS 把 standalone 文件夹打成单个安装器 exe（用户双击安装、得一个图标）。
      - name: Install NSIS (Windows)
        if: matrix.os == 'windows'
        run: choco install nsis --no-progress

      # 注意：此步骤必须用 pwsh 而非 bash。Git Bash(MSYS) 会把 /DVERSION=...
      # 误当成路径转换成 C:/Program Files/Git/DVERSION=...，导致 makensis 找不到脚本。
      # PowerShell 不做该转换，/DVERSION= 原样传参。
      - name: Build installer (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $VER = (Get-Content VERSION).Trim()
          $VERNUM = $VER -replace '^v',''      # NSIS VIProductVersion 只收纯数字
          $MAKENSIS = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $MAKENSIS)) { $MAKENSIS = "makensis" }
          & $MAKENSIS /DVERSION=$VER /DVERNUM=$VERNUM installer.nsi
          ls tfd-mentor-setup.exe

      # Windows 双轨分发：除了 setup.exe 安装包，再打一个"文件夹 zip"作为主推分发
      # （解压后的主程序 exe 已实测 VirusTotal 0 报；安装包外壳偶被 Defender ML 误报）。
      # Windows runner 没有 zip 命令，用 PowerShell 的 Compress-Archive。
      - name: Package (Windows zip)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist\论文格式医生·导师版（免安装版）\*" -DestinationPath "release\tfd-mentor-windows.zip" -Force
          ls release

      # macOS：把 .app 压缩成 zip 作为发布物。
      - name: Package (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          mkdir -p release
          ditto -c -k -v "dist/tfd-mentor.app" "release/tfd-mentor-macos.zip"

      # Linux：把 standalone 文件夹压缩成 zip。
      - name: Package (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p release
          cd dist && zip -r "../release/tfd-mentor-linux.zip" "tfd-mentor"

      # 构建后自检：运行时资源（窗口图标 / 二维码 / 水印图）必须真的进了产物。
      # v1.1.0 及更早的 build.py 漏了 tfd_app/assets，而读取方都有 isfile 守卫，
      # 于是打包版「二维码不显示、水印图丢失」却**全程静默**。这一步把它变成构建红灯。
      - name: Verify bundled runtime assets
        shell: bash
        run: python tools/verify_bundle.py dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfd-mentor-${{ matrix.os }}
          path: |
            tfd-mentor-setup.exe
            release/tfd-mentor-windows.zip
            release/tfd-mentor-macos.zip
            release/tfd-mentor-linux.zip
          if-no-files-found: ignore
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    # 只在打 tag 时发布：workflow_dispatch 仅构建 + 上传 artifact。
    # 否则手动构建会把「未发版的产物」写到已发布版本的 Release 上（tag 与产物错配）。
    if: needs.build.result == 'success' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage assets
        run: |
          mkdir -p release
          for plat in windows macos linux; do
            find "artifacts/tfd-mentor-$plat" -type f | while read f; do
              cp "$f" "release/$(basename "$f")"
            done
          done
          ls -la release

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="$(cat VERSION | tr -d '[:space:]')"
            [ -z "$version" ] && version="latest"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          files: release/*
          generate_release_notes: true
