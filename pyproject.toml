[project]
name = "tfd-mentor"
version = "1.0.0"
description = "论文格式医生 · 导师版 —— 导师检查学生论文格式、生成带批注副本的纯本地离线桌面程序"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "reedskill" }]
keywords = ["docx", "论文格式", "格式检查", "GB/T 7714", "thesis", "mentor"]

[project.urls]
Homepage = "https://reedskill.com"
Repository = "https://github.com/Reedgege/tfd-mentor"

# 零第三方依赖：引擎仅用 Python 标准库
[project.dependencies]

[build-system]
requires = ["pyinstaller>=6.0"]
build-backend = "pyinstaller"  # 占位；实际通过 build.py / GitHub Actions 构建
